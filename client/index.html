<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b1f1a" />
    <script>
      document.documentElement.dataset.initialTheme = "dark";
      try {
        const saved = JSON.parse(localStorage.getItem("yra-visual-golden-v1") || "null");
        if (saved && saved.theme === "light") {
          document.documentElement.dataset.initialTheme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#fffaf0";
        }
      } catch { /* Use the dark default when saved preferences are unavailable. */ }
    </script>
    <style>
      html, body, #root { min-height: 100%; }
      html, html[data-initial-theme="dark"] body { background: #020c0c; color-scheme: dark; }
      html[data-initial-theme="light"],
      html[data-initial-theme="light"] body { background: #f8f5eb; color-scheme: light; }
    </style>
    <meta
      name="description"
      content="منصة رقمية شاملة للسيرة النبوية العطرة، القرآن الكريم، الأذكار، والمواقيت والمعرفة الإسلامية."
    />
    <meta property="og:title" content="يا رسول الله ﷺ" />
    <meta property="og:description" content="منصة رقمية شاملة للسيرة النبوية العطرة، القرآن الكريم، الأذكار، والمواقيت والمعرفة الإسلامية." />
    <title>يا رسول الله ﷺ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
