name: Build Islamic Library Acquisition Manifests
on:
  push:
    branches:
      - research/library-acquisition-20260923-deep1
    paths:
      - "scripts/research/build_islamic_library_acquisition.py"
      - "research/library-acquisition/2026-09-23/inputs/**"
      - ".github/workflows/library-acquisition-research-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/library-acquisition-20260923-deep1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate
        run: python scripts/research/build_islamic_library_acquisition.py
      - name: Integrity
        run: |
          git diff --check
          test -f research/library-acquisition/2026-09-23/23-machine-readable-import-manifest.json
          test -f research/library-acquisition/2026-09-23/24-final-research-report.md
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/library-acquisition/2026-09-23
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: materialize Islamic library acquisition pack [skip research-build]"
          git push origin HEAD:research/library-acquisition-20260923-deep1
