name: Visual Golden Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/grok-visual-golden-master-20260924

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run check

      - name: Source governance
        run: npm run validate:sources

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
