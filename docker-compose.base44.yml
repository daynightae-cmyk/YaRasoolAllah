services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - base44_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}"
    command: sh -c "npm ci && npx tsx watch server/index.ts"

volumes:
  base44_node_modules:
